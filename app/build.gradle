plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.artur.antskip"
    compileSdk 35

    defaultConfig {
        applicationId "com.artur.antskip"
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName "1.35"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "antskippassword"
            keyAlias "antskip"
            keyPassword "antskippassword"
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
