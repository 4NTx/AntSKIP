plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.artur.antskip"
    compileSdk 35

    defaultConfig {
        applicationId "com.artur.antskip"
        minSdk 26
        targetSdk 35
        versionCode 32
        versionName "1.32"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
